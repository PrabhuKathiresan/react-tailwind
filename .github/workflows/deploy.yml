name: 🌍 Deploy Demo Site to GitHub Pages

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Demo
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false # we'll run install manually

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: 'pnpm'

      - name: Check folder structure
        run: ls -R .

      - name: Install library dependencies
        run: pnpm install

      - name: Build library
        run: pnpm run build

      - name: Install demo app dependencies
        working-directory: my-ui-pages
        run: pnpm install

      - name: Build demo app
        working-directory: my-ui-pages
        run: pnpm run build

      # Docs versioning: root always mirrors "latest"; a minor/major release
      # (patch version 0) also gets a permanent snapshot under /v/<version>/.
      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" = "0" ]; then ARCHIVE=true; else ARCHIVE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Assemble versioned docs
        run: |
          # Clear the previous "latest" build from the root, keeping archived
          # versions, the manifest, and GitHub Pages control files intact.
          find gh-pages-checkout -mindepth 1 -maxdepth 1 \
            ! -name 'v' ! -name 'versions.json' ! -name '.git' ! -name '.nojekyll' ! -name 'CNAME' \
            -exec rm -rf {} +

          cp -r my-ui-pages/dist/. gh-pages-checkout/

          if [ "${{ steps.version.outputs.archive }}" = "true" ]; then
            mkdir -p "gh-pages-checkout/v/${{ steps.version.outputs.version }}"
            cp -r my-ui-pages/dist/. "gh-pages-checkout/v/${{ steps.version.outputs.version }}/"
          fi

          node scripts/publish-docs-version.mjs \
            gh-pages-checkout \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.archive }}"

      - name: Publish to GitHub Pages
        working-directory: gh-pages-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish v${{ steps.version.outputs.version }}" --allow-empty
          git push origin gh-pages
